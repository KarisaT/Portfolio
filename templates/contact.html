<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nahum Portfolio - Contact</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
  body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    background-attachment: fixed;
    background-size: cover;
    min-height: 100vh;
    margin: 0;
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #f8f9fa;
    line-height: 1.6;
  }

  /* Glassmorphism card */
  .glass-card, .styled-form {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(14px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    animation: fadeInUp 1s ease both;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .glass-card:hover, .styled-form:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 40px rgba(0,255,153,0.25);
  }

  /* Profile image */
  img.rounded-circle {
    border: 4px solid #00ff99;
    box-shadow: 0 0 25px rgba(0,255,153,0.7);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }
  img.rounded-circle:hover {
    transform: scale(1.1);
    box-shadow: 0 0 45px rgba(0,255,153,0.9);
  }

  /* Headings */
  h1 {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(90deg, #00ff99, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }
  h2 {
    font-weight: 600;
    color: #d1d1d1;
    margin-bottom: 1rem;
  }

  /* Modern button */
  .btn-modern {
    background: linear-gradient(135deg, #00ff99, #00ccff);
    border: none;
    border-radius: 50px;
    padding: 12px 32px;
    font-weight: 600;
    color: #0f0f0f;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-modern:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0,255,153,0.6);
  }

  /* Animation */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Gradient divider */
  hr {
    border: 0;
    height: 3px;
    background: linear-gradient(90deg, #00ff99, #00ccff);
    margin: 3rem 0;
  }
  </style>
</head>
<body>
  <!-- Contact Header -->
  <div class="container mt-5">
    <div class="glass-card">
      <div class="row align-items-center">
        <div class="col-md-4 text-center">
          <img src="{{ url_for('static', filename='images/me.png') }}"
               alt="Nahum's profile photo" 
               class="rounded-circle mb-4 shadow"
               width="200" height="200">
        </div>
        <div class="col-md-8">
          <h1 class="fw-bold">Contact Me</h1>
          <h2>Let’s Get in Touch</h2>
          <p class="lead">
            I’d love to hear from you! Whether it’s about collaboration, project ideas, 
            or opportunities, feel free to reach out using the form below.
          </p>

          <!-- Navigation Buttons -->
          <div class="mt-3 text-center">
            <a href="{{ url_for('home') }}" class="btn-modern">Home</a>
            <a href="{{ url_for('projects') }}" class="btn-modern ms-2">Projects</a>
            <a href="{{ url_for('resume') }}" class="btn-modern ms-2">Resume</a>
            <a href="{{ url_for('contact') }}" class="btn-modern ms-2">Contact</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <hr class="my-5">

  <!-- Contact Form Section -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="fw-bold mb-3 text-center">Send a Message</h2>
        
        <form method="post" action="/send_message" class="styled-form">
          <div class="mb-3">
            <label for="name" class="form-label fw-bold">Your Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label fw-bold">Your Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label fw-bold">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here"></textarea>
          </div>

          <!-- Buttons side by side -->
          <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn-modern">Send Message</button>
            <a href="https://wa.me/254108038160" target="_blank" class="btn-modern">
              WhatsApp
            </a>
          </div>

          <!-- Contact Info -->
          <p class="mt-3 text-center"><strong>Email:</strong> toyacharo@outlook.com</p>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
