<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nahum Portfolio - Contact</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(270deg, #0f2027, #203a43, #2c5364, #1a1a2e, #16213e);
      background-size: 800% 800%;
      animation: bgShift 20s ease infinite;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f8f9fa;
      line-height: 1.7;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 40px rgba(0,255,153,0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 60px rgba(0,255,153,0.4);
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00ff99, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    h2 {
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 1rem;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .btn-modern {
      background: linear-gradient(270deg, #00ff99, #00ccff);
      background-size: 400% 400%;
      animation: gradientShift 6s ease infinite;
      border: none;
      border-radius: 50px;
      padding: 12px 32px;
      font-weight: 600;
      color: #0f0f0f;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      text-decoration: none;
    }
    .btn-modern:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,255,153,0.6), 0 0 20px rgba(0,204,255,0.5);
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .styled-form .form-control {
      background: rgba(0,255,153,0.08);
      border: 1px solid #00ff99;
      color: #f8f9fa;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0,255,153,0.25);
    }
    .styled-form .form-control:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0,255,153,0.6);
      background: rgba(0,255,153,0.12);
    }
    .styled-form label {
      color: #00ffcc;
      font-weight: 600;
    }

    .contact-card {
      background: rgba(0, 255, 153, 0.08);
      border-left: 6px solid #00ff99;
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 8px 24px rgba(0,255,153,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .contact-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 36px rgba(0,255,153,0.6);
    }
  </style>
</head>
<body>
  <!-- Contact Header -->
  <div class="container mt-5">
    <div class="glass-card text-center">
      <h1 class="fw-bold">Contact Me</h1>
      <h2>Let’s Get in Touch</h2>
      <p class="lead">
        I’d love to hear from you! Whether it’s about collaboration, project ideas, 
        or opportunities, feel free to reach out using the form below.
      </p>
      <div class="mt-3">
        <a href="{{ url_for('home') }}" class="btn-modern">Home</a>
        <a href="{{ url_for('projects') }}" class="btn-modern ms-2">Projects</a>
        <a href="{{ url_for('resume') }}" class="btn-modern ms-2">Resume</a>
        <a href="{{ url_for('contact') }}" class="btn-modern ms-2">Contact</a>
      </div>
    </div>
  </div>

  <hr class="my-5">

  <!-- Contact Form Section -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 contact-card">
        <h2 class="fw-bold mb-3 text-center">Send a Message</h2>
        
        <form method="post" action="/send_message" class="styled-form">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here"></textarea>
          </div>

          <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn-modern">Send Message</button>
            <a href="https://wa.me/254108038160" target="_blank" class="btn-modern">WhatsApp</a>
          </div>

          <p class="mt-3 text-center"><strong>Email:</strong> toyacharo@outlook.com</p>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
